name: STEP69 Hatchman final reality v2

on:
  push:
    branches:
      - bod-step56-final-residue-check
    paths:
      - ".github/workflows/step69-final-reality-v2.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21907a8840747c985d46fd40661ec3a25ecd1e74
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Build current main
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm run functions:build

      - name: Validate final Reality
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          PROD="https://hatchman.org"
          SNAP="https://bod-step56-final-residue-che.hatchman.pages.dev/__ydi_step69_r2"
          UA="YDI-STEP69-Hatchman-v2/1.0"

          def req(url, method="GET"):
              request=urllib.request.Request(url,method=method,headers={"User-Agent":UA})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      body=response.read() if method!="HEAD" else b""
                      return response.status,dict(response.headers),body
              except urllib.error.HTTPError as exc:
                  body=exc.read() if method!="HEAD" else b""
                  return exc.code,dict(exc.headers),body

          published=[]
          current_content=set()
          content_rx=re.compile(r'/media/(content/asset-[0-9]{6}\.[A-Za-z0-9]+)')
          generic_rx=re.compile(r'/media/([^"\'<>\s)]+)')
          current_all=set()

          for path in pathlib.Path("src/content/articles").glob("*.md"):
              text=path.read_text(encoding="utf-8")
              front=text.split("---",2)[1]
              status=re.search(r'^status:\s*["\']?([^"\'\s]+)',front,re.M)
              route=re.search(r'^path:\s*["\']([^"\']+)["\']',front,re.M)
              if status and status.group(1)=="publish":
                  published.append(route.group(1))
              current_content.update(content_rx.findall(text))
              current_all.update(generic_rx.findall(text))

          layout=pathlib.Path("src/layouts/BaseLayout.astro").read_text(encoding="utf-8")
          current_all.update(generic_rx.findall(layout))

          assert len(published)==404, len(published)
          assert len(current_content)==3348, len(current_content)
          assert len(current_all)==3350, len(current_all)
          assert current_all-current_content == {
              "site/external-image-disabled.svg",
              "site/logo_title.png",
          }, sorted(current_all-current_content)

          article_failures=[]
          def check_article(route):
              code,_,_=req(PROD+route)
              return None if code==200 else (route,code)

          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as pool:
              for result in pool.map(check_article,published):
                  if result:
                      article_failures.append(result)

          media_failures=[]
          def check_media(key):
              code,_,_=req(PROD+"/media/"+key,"HEAD")
              return None if code==200 else (key,code)

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              for result in pool.map(check_media,sorted(current_all)):
                  if result:
                      media_failures.append(result)

          home_code,_,home=req(PROD+"/")
          home_text=home.decode("utf-8","replace")
          ads_code,_,ads_body=req(PROD+"/ads.txt")
          unknown_code,_,_=req(PROD+"/__ydi_step69_not_found__")

          assert home_code==200, home_code
          assert "G-E571E34BQF" in home_text
          assert "ca-pub-7781274978364717" in home_text
          assert "/media/site/logo_title.png" in home_text
          assert ads_code==200 and len(ads_body)>0
          assert unknown_code==404, unknown_code

          snap=None
          for _ in range(120):
              code,_,body=req(SNAP)
              if code==200:
                  snap=json.loads(body.decode("utf-8"))
                  break
              time.sleep(2)
          assert snap is not None

          keys=[row["key"] for row in snap["objects"]]
          content_keys=[key for key in keys if key.startswith("content/asset-")]
          site_keys=[key for key in keys if key.startswith("site/")]

          assert snap["count"]==5001, snap["count"]
          assert snap["total_bytes"]==675034469, snap["total_bytes"]
          assert len(content_keys)==4995, len(content_keys)
          assert len(site_keys)==6, len(site_keys)
          assert len(content_keys)+len(site_keys)==len(keys)
          assert current_all <= set(keys)
          assert "content/ydi-step68-normal-operation.png" not in keys
          assert not article_failures, article_failures[:10]
          assert not media_failures, media_failures[:10]

          print(json.dumps({
              "main":"21907a8840747c985d46fd40661ec3a25ecd1e74",
              "build":"PASS",
              "production_articles":404,
              "article_failures":0,
              "production_media":3350,
              "production_content_media":3348,
              "production_site_media":2,
              "media_failures":0,
              "home":200,
              "ads_txt":200,
              "analytics":"PASS",
              "adsense":"PASS",
              "top_logo":"PASS",
              "unknown":404,
              "r2_objects":5001,
              "r2_total_bytes":675034469,
              "content_objects":4995,
              "site_objects":6,
              "step68_test_residue":0
          },ensure_ascii=False,indent=2))
          PY
