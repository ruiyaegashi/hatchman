name: STEP52 Preview Validation

on:
  push:
    branches:
      - bod-step52-neutral-media-urls
    paths:
      - ".github/workflows/step52-preview-validate.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_BASE: https://bod-step52-neutral-media-url.hatchman.pages.dev
      FIXED_REF: f06de04bafb5a4173c08d87238c7a685bfd1217a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bod-step52-neutral-media-urls
          fetch-depth: 0

      - name: Wait for branch Preview
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -sS -o /tmp/root.html -w '%{http_code}' "$PREVIEW_BASE/" || true)"
            [[ "$code" == "200" ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Validate all published pages and media targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FIXED_REF" --depth=1
          git show "$FIXED_REF:src/media/generated/objects.json" > "$RUNNER_TEMP/objects.json"

          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = os.environ["PREVIEW_BASE"].rstrip("/")
          articles = sorted(Path("src/content/articles").glob("*.md"))
          assert len(articles) == 407

          published_paths = []
          for path in articles:
              data = path.read_bytes()
              head = data.split(b"---", 2)[1].decode("utf-8")
              status = re.search(r"(?m)^status:\s*([^\r\n]+)", head)
              route = re.search(r"(?m)^path:\s*(.+)$", head)
              assert status
              if status.group(1).strip() == "publish":
                  assert route, path
                  published_paths.append(route.group(1).strip().strip('"').strip("'"))

          assert len(published_paths) == 404, len(published_paths)
          assert len(set(published_paths)) == 404

          old_ref = re.compile(rb"/media/legacy/")
          new_ref = re.compile(rb"/media/content/asset-(\d{6})\.([A-Za-z0-9]+)")

          def get_page(route):
              url = base + "/" + route.strip("/") + "/"
              req = urllib.request.Request(url, headers={"User-Agent":"YDI-STEP52-Validator"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return route, response.status, body

          total_new_refs = 0
          unique_urls = set()
          old_refs = 0

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for route, status, body in pool.map(get_page, published_paths):
                  assert status == 200, (route, status)
                  old_refs += len(old_ref.findall(body))
                  matches = list(new_ref.finditer(body))
                  total_new_refs += len(matches)
                  for match in matches:
                      unique_urls.add(match.group(0).decode("ascii"))

          assert old_refs == 0, old_refs
          assert total_new_refs == 3422, total_new_refs
          assert len(unique_urls) == 3348, len(unique_urls)

          registry = json.loads(Path(os.environ["RUNNER_TEMP"] + "/objects.json").read_text(encoding="utf-8"))
          expected = {}
          for key, meta in registry.items():
              if not key.startswith("legacy/legacy-"):
                  continue
              target = "/" + key.replace("legacy/legacy-", "media/content/asset-")
              expected[target] = {
                  "size": int(meta["size"]),
                  "contentType": meta.get("contentType"),
              }

          assert len(expected) == 4995
          assert unique_urls <= set(expected)

          def head_media(path):
              url = base + path
              req = urllib.request.Request(url, method="HEAD", headers={"User-Agent":"YDI-STEP52-Validator"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  size = int(response.headers.get("Content-Length", "-1"))
                  ctype = response.headers.get("Content-Type")
                  exp = expected[path]
                  assert response.status == 200, (path, response.status)
                  assert size == exp["size"], (path, size, exp["size"])
                  if exp["contentType"]:
                      assert ctype == exp["contentType"], (path, ctype, exp["contentType"])
                  return path

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              list(pool.map(head_media, sorted(unique_urls)))

          missing_url = base + "/__step52-not-found-check__/"
          try:
              urllib.request.urlopen(
                  urllib.request.Request(missing_url, headers={"User-Agent":"YDI-STEP52-Validator"}),
                  timeout=30,
              )
              raise AssertionError("404 route unexpectedly returned success")
          except urllib.error.HTTPError as exc:
              assert exc.code == 404, exc.code

          print("published_pages=404")
          print("published_page_failures=0")
          print("old_media_refs=0")
          print("new_media_refs=3422")
          print("unique_media_targets=3348")
          print("media_head_verified=3348")
          print("media_failures=0")
          print("not_found_status=404")
          print("RESULT=PASS")
          PY

      - name: Remove temporary validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/step52-preview-validate.yml
          git commit -m 'Remove temporary STEP52 Preview validator'
          git push origin HEAD:bod-step52-neutral-media-urls
