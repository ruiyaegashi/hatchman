name: STEP55 Delete Hatchman Legacy R2 Objects

on:
  push:
    branches:
      - bod-step55-delete-legacy-r2
    paths:
      - ".github/workflows/step55-delete-legacy-r2.yml"

permissions:
  contents: read

concurrency:
  group: step55-delete-hatchman-legacy-r2
  cancel-in-progress: false

jobs:
  delete-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.HATCHMAN_R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HATCHMAN_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HATCHMAN_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET: hatchman-media
      FIXED_LEDGER_REF: f06de04bafb5a4173c08d87238c7a685bfd1217a
      PRODUCTION_BASE: https://hatchman.org

    steps:
      - uses: actions/checkout@v4
        with:
          ref: bod-step55-delete-legacy-r2
          fetch-depth: 0

      - name: Prepare fixed delete set
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${R2_ACCOUNT_ID:-}" ]]
          [[ -n "${AWS_ACCESS_KEY_ID:-}" ]]
          [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]]

          git fetch origin "$FIXED_LEDGER_REF" --depth=1
          git show "$FIXED_LEDGER_REF:migration/media-canonical.json" > "$RUNNER_TEMP/media-canonical.json"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ledger = json.loads((Path(os.environ["RUNNER_TEMP"]) / "media-canonical.json").read_text(encoding="utf-8"))
          rows = [o for o in ledger["objects"] if o["object_key"].startswith("legacy/")]
          assert len(rows) == 4995
          assert sum(int(o["bytes"]) for o in rows) == 674646234
          assert all(re.fullmatch(r"legacy/legacy-\d{6}\.[A-Za-z0-9]+", o["object_key"]) for o in rows)
          assert len({o["object_key"] for o in rows}) == 4995
          mapped = [re.sub(r"^legacy/legacy-", "content/asset-", o["object_key"]) for o in rows]
          assert len(set(mapped)) == 4995
          print("delete-set=PASS")
          PY

      - name: Install R2 client
        run: python3 -m pip install --disable-pip-version-check --quiet boto3

      - name: Delete exact legacy set and verify neutral set remains
        shell: bash
        run: |
          set -euo pipefail
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          import boto3
          from botocore.config import Config

          bucket = os.environ["R2_BUCKET"]
          endpoint = os.environ["R2_ENDPOINT"]
          base = os.environ["PRODUCTION_BASE"].rstrip("/")
          ledger = json.loads((Path(os.environ["RUNNER_TEMP"]) / "media-canonical.json").read_text(encoding="utf-8"))

          rows = []
          for o in ledger["objects"]:
              old = o["object_key"]
              if not old.startswith("legacy/"):
                  continue
              m = re.fullmatch(r"legacy/legacy-(\d{6})\.([A-Za-z0-9]+)", old)
              assert m, old
              rows.append({
                  "old": old,
                  "new": f"content/asset-{m.group(1)}.{m.group(2)}",
                  "bytes": int(o["bytes"]),
              })

          rows.sort(key=lambda x: x["old"])
          assert len(rows) == 4995
          assert len({x["old"] for x in rows}) == 4995
          assert len({x["new"] for x in rows}) == 4995
          assert sum(x["bytes"] for x in rows) == 674646234

          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name="auto",
              config=Config(
                  retries={"max_attempts": 8, "mode": "adaptive"},
                  max_pool_connections=32,
                  connect_timeout=10,
                  read_timeout=120,
              ),
          )

          def list_prefix(prefix):
              result = {}
              paginator = s3.get_paginator("list_objects_v2")
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  for obj in page.get("Contents", []):
                      result[obj["Key"]] = int(obj["Size"])
              return result

          expected_old = {x["old"]: x["bytes"] for x in rows}
          expected_new = {x["new"]: x["bytes"] for x in rows}

          before_old = list_prefix("legacy/")
          before_new = list_prefix("content/asset-")
          before_site = list_prefix("site/")

          assert before_old == expected_old, {
              "old_count": len(before_old),
              "missing": sorted(set(expected_old) - set(before_old))[:10],
              "extra": sorted(set(before_old) - set(expected_old))[:10],
              "size_mismatch": [k for k in expected_old if k in before_old and expected_old[k] != before_old[k]][:10],
          }
          assert before_new == expected_new, {
              "new_count": len(before_new),
              "missing": sorted(set(expected_new) - set(before_new))[:10],
              "extra": sorted(set(before_new) - set(expected_new))[:10],
              "size_mismatch": [k for k in expected_new if k in before_new and expected_new[k] != before_new[k]][:10],
          }
          assert len(before_site) == 6, len(before_site)

          deleted = 0
          for start in range(0, len(rows), 1000):
              batch = rows[start:start + 1000]
              response = s3.delete_objects(
                  Bucket=bucket,
                  Delete={
                      "Objects": [{"Key": row["old"]} for row in batch],
                      "Quiet": True,
                  },
              )
              errors = response.get("Errors", [])
              assert not errors, errors[:10]
              deleted += len(batch)

          assert deleted == 4995

          after_old = list_prefix("legacy/")
          after_new = list_prefix("content/asset-")
          after_site = list_prefix("site/")

          assert after_old == {}, list(after_old)[:10]
          assert after_new == expected_new
          assert len(after_site) == 6

          articles = sorted(Path("src/content/articles").glob("*.md"))
          assert len(articles) == 407
          old_ref = re.compile(rb"/media/legacy/")
          new_ref = re.compile(rb"/media/content/asset-(\d{6})\.([A-Za-z0-9]+)")
          old_refs = 0
          new_refs = 0
          unique_urls = set()

          for path in articles:
              data = path.read_bytes()
              old_refs += len(old_ref.findall(data))
              matches = list(new_ref.finditer(data))
              new_refs += len(matches)
              unique_urls.update(match.group(0).decode("ascii") for match in matches)

          assert old_refs == 0
          assert new_refs == 3422
          assert len(unique_urls) == 3348

          expected_http = {"/media/" + row["new"]: row["bytes"] for row in rows}
          assert unique_urls <= set(expected_http)

          def head_media(path):
              req = urllib.request.Request(
                  base + path,
                  method="HEAD",
                  headers={"User-Agent": "YDI-STEP55-Validator"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  size = int(response.headers.get("Content-Length", "-1"))
                  assert response.status == 200, (path, response.status)
                  assert size == expected_http[path], (path, size, expected_http[path])
                  return path

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              list(pool.map(head_media, sorted(unique_urls)))

          result = {
              "status": "PASS",
              "bucket": bucket,
              "legacy_before": len(before_old),
              "legacy_deleted": deleted,
              "legacy_after": len(after_old),
              "content_objects_after": len(after_new),
              "content_bytes_after": sum(after_new.values()),
              "site_objects_after": len(after_site),
              "article_old_media_refs": old_refs,
              "article_new_media_refs": new_refs,
              "unique_current_media_targets": len(unique_urls),
              "production_media_verified_after_delete": len(unique_urls),
              "production_media_failures": 0,
          }

          out = Path(os.environ["RUNNER_TEMP"]) / "step55-result.json"
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload STEP55 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step55-hatchman-legacy-r2-delete-${{ github.run_id }}
          path: ${{ runner.temp }}/step55-result.json
          if-no-files-found: error
          retention-days: 30
