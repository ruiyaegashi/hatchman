name: STEP48 neutralize Hatchman articles

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  transform:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bod-step48-hatchman-neutralize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Transform STEP48 scope
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          root = Path('.')
          old_dir = root / 'src/content/legacy'
          new_dir = root / 'src/content/articles'
          files = sorted(old_dir.glob('*.md'))
          assert len(files) == 407, f'expected 407 articles, got {len(files)}'

          historical = {
              'wp_id', 'content_type', 'modified_at', 'legacy_url', 'legacy_path',
              'legacy_slug', 'former_slugs', 'parent_wp_id', 'categories', 'tags',
              'source_content_sha256', 'source_content_chars', 'migration_review',
          }
          allowed = {'title', 'published_at', 'status', 'path'}
          explicit_names = {
              'wp-009612-untitled.md': 'ramen.md',
              'wp-009805-untitled.md': 'pero-profile.md',
          }

          stripped = [re.sub(r'^wp-\d+-', '', p.name) for p in files]
          dup = {name: count for name, count in Counter(stripped).items() if count > 1}
          assert dup == {'untitled.md': 2}, f'unexpected filename collisions: {dup}'

          def split_doc(path):
              raw = path.read_bytes().decode('utf-8')
              if raw.startswith('---\r\n'):
                  eol = '\r\n'
              elif raw.startswith('---\n'):
                  eol = '\n'
              else:
                  raise AssertionError(f'frontmatter start missing: {path}')
              marker = eol + '---' + eol
              end = raw.find(marker, 3 + len(eol))
              if end < 0:
                  raise AssertionError(f'frontmatter end missing: {path}')
              fm = raw[len('---' + eol):end]
              body = raw[end + len(marker):]
              return eol, fm.split(eol), body

          def scalar(value):
              v = value.strip()
              if len(v) >= 2 and v[0] == v[-1] and v[0] in ('"', "'"):
                  return v[1:-1]
              return v

          parsed = []
          published_paths = defaultdict(list)
          disabled_files = 0
          shortcode_files = 0

          for path in files:
              eol, lines, body = split_doc(path)
              fields = {}
              for line in lines:
                  if not line.strip():
                      continue
                  m = re.match(r'^([A-Za-z0-9_]+):(?:\s*(.*))?$', line)
                  assert m, f'multiline/unknown frontmatter line in {path}: {line!r}'
                  key, value = m.group(1), (m.group(2) or '')
                  assert key in historical or key in allowed, f'unexpected key {key} in {path}'
                  assert key not in fields, f'duplicate key {key} in {path}'
                  fields[key] = value

              status = scalar(fields.get('status', 'publish'))
              assert status in {'publish', 'draft'}, f'unexpected status {status} in {path}'
              current_path = fields.get('path')
              old_path = fields.get('legacy_path')
              if current_path is not None and old_path is not None:
                  assert scalar(current_path) == scalar(old_path), f'path mismatch in {path}'
              if status == 'publish':
                  chosen = current_path if current_path is not None else old_path
                  assert chosen is not None and scalar(chosen) not in {'', '//'}, f'published path missing/invalid in {path}'
                  published_paths[scalar(chosen)].append(path.name)

              if 'legacy-disabled' in body:
                  disabled_files += 1
              if 'legacy-shortcode' in body:
                  shortcode_files += 1
              parsed.append((path, eol, lines, body, fields, status))

          collisions = {k: v for k, v in published_paths.items() if len(v) > 1}
          assert not collisions, f'published path collisions: {collisions}'
          assert disabled_files == 127, f'legacy-disabled file count changed: {disabled_files}'
          assert shortcode_files == 13, f'legacy-shortcode file count changed: {shortcode_files}'

          new_dir.mkdir(parents=True, exist_ok=False)
          written = []

          for path, eol, lines, body, fields, status in parsed:
              out = []
              has_path = 'path' in fields
              for line in lines:
                  if not line.strip():
                      out.append(line)
                      continue
                  key = line.split(':', 1)[0]
                  if key in historical:
                      if key == 'legacy_path' and status == 'publish' and not has_path:
                          out.append('path:' + line[len('legacy_path:'):])
                      continue
                  out.append(line)

              body2 = body
              body2 = body2.replace('class="legacy-disabled legacy-shortcode"', 'class="preserved-content unsupported-embed"')
              body2 = body2.replace('class="legacy-disabled"', 'class="preserved-content unsupported-embed"')
              body2 = body2.replace('<strong>旧browser-shot（停止）</strong>', '<strong>埋め込みコンテンツ（現在非表示）</strong>')
              body2 = body2.replace('旧iframe埋め込み（安全のため停止）:', '埋め込みコンテンツ（現在非表示）:')
              assert 'legacy-disabled' not in body2 and 'legacy-shortcode' not in body2, f'technical marker remained in {path}'

              target_name = explicit_names.get(path.name, re.sub(r'^wp-\d+-', '', path.name))
              target = new_dir / target_name
              assert not target.exists(), f'target collision: {target}'
              content = '---' + eol + eol.join(out) + eol + '---' + eol + body2
              target.write_bytes(content.encode('utf-8'))
              written.append(target)

          for path in files:
              path.unlink()
          old_dir.rmdir()

          assert len(written) == 407
          assert len(list(new_dir.glob('*.md'))) == 407

          config = """import { defineCollection } from 'astro:content';
          import { glob } from 'astro/loaders';
          import { z } from 'astro/zod';

          const articles = defineCollection({
            loader: glob({ base: './src/content/articles', pattern: '**/*.md' }),
            schema: z.object({
              title: z.string(),
              published_at: z.string(),
              status: z.enum(['publish', 'draft']).default('publish'),
              path: z.string().optional(),
            }).refine((data) => data.status === 'draft' || Boolean(data.path), {
              message: 'path is required for published articles',
            }),
          });

          export const collections = { articles };
          """
          Path('src/content.config.ts').write_text(config, encoding='utf-8')

          old_route = Path('src/pages/[...legacy].astro')
          assert old_route.exists()
          old_route.unlink()
          route = """---
          import { getCollection, render } from 'astro:content';
          import BaseLayout from '../layouts/BaseLayout.astro';

          export async function getStaticPaths() {
            const entries = (await getCollection('articles')).filter((entry) => entry.data.status === 'publish');
            return entries.map((entry) => ({
              params: { path: entry.data.path!.replace(/^\\/+|\\/+$/g, '') },
              props: { entry },
            }));
          }

          const { entry } = Astro.props;
          const { Content } = await render(entry);
          ---
          <BaseLayout title={entry.data.title}>
            <article>
              <h1>{entry.data.title}</h1>
              <p><time datetime={entry.data.published_at}>{entry.data.published_at.slice(0, 10)}</time></p>
              <Content />
            </article>
          </BaseLayout>
          """
          Path('src/pages/[...path].astro').write_text(route, encoding='utf-8')

          index = """---
          import { getCollection } from 'astro:content';
          import BaseLayout from '../layouts/BaseLayout.astro';

          const articles = (await getCollection('articles'))
            .filter((entry) => entry.data.status === 'publish')
            .sort((a, b) => b.data.published_at.localeCompare(a.data.published_at));

          const articlePath = (entry: (typeof articles)[number]) => entry.data.path!;
          ---
          <BaseLayout>
            <h1>Hatchman</h1>
            <ul>
              {articles.map((entry) => (
                <li>
                  <time>{entry.data.published_at.slice(0, 10)}</time>
                  {' '}
                  <a href={articlePath(entry)}>{entry.data.title}</a>
                </li>
              ))}
            </ul>
          </BaseLayout>
          """
          Path('src/pages/index.astro').write_text(index, encoding='utf-8')

          # Post-transform validation
          assert not Path('src/content/legacy').exists()
          assert not Path('src/pages/[...legacy].astro').exists()
          assert Path('src/pages/[...path].astro').exists()
          assert 'legacy_path' not in Path('src/content.config.ts').read_text(encoding='utf-8')
          assert 'legacy' not in Path('src/pages/[...path].astro').read_text(encoding='utf-8')
          assert 'legacy_path' not in Path('src/pages/index.astro').read_text(encoding='utf-8')

          remaining = []
          for path in new_dir.glob('*.md'):
              text = path.read_bytes().decode('utf-8')
              for marker in ('legacy-disabled', 'legacy-shortcode', '\nwp_id:', '\nlegacy_path:', '\nlegacy_url:', '\nlegacy_slug:', '\nformer_slugs:', '\nparent_wp_id:', '\nmigration_review:', '\nsource_content_sha256:', '\nsource_content_chars:'):
                  if marker in text:
                      remaining.append((str(path), marker))
          assert not remaining, f'residue remained: {remaining[:20]}'

          print(f'articles={len(written)} publish_paths={len(published_paths)} disabled_files={disabled_files} shortcode_files={shortcode_files}')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run functions:build
      - run: git diff --check

      - name: Commit transformed STEP48 files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/content src/content.config.ts src/pages
          git diff --cached --quiet && { echo 'No STEP48 changes produced'; exit 1; }
          git commit -m 'Implement STEP48 Hatchman article neutralization'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
