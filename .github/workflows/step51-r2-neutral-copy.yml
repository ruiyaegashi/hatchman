name: STEP51 Hatchman R2 Neutral Copy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step51-r2-neutral-copy.yml"

permissions:
  contents: read

concurrency:
  group: step51-hatchman-r2-neutral-copy
  cancel-in-progress: false

jobs:
  copy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.HATCHMAN_R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HATCHMAN_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HATCHMAN_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET: hatchman-media
      FIXED_LEDGER_REF: f06de04bafb5a4173c08d87238c7a685bfd1217a

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight secrets and fixed ledger
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${R2_ACCOUNT_ID:-}" ]] || { echo "HATCHMAN_R2_ACCOUNT_ID is required" >&2; exit 2; }
          [[ -n "${AWS_ACCESS_KEY_ID:-}" ]] || { echo "HATCHMAN_R2_ACCESS_KEY_ID is required" >&2; exit 2; }
          [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]] || { echo "HATCHMAN_R2_SECRET_ACCESS_KEY is required" >&2; exit 2; }

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "R2_ENDPOINT=$endpoint" >> "$GITHUB_ENV"

          git fetch origin "$FIXED_LEDGER_REF" --depth=1
          git show "$FIXED_LEDGER_REF:migration/media-canonical.json" > "$RUNNER_TEMP/media-canonical.json"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          ledger = json.loads((Path(os.environ["RUNNER_TEMP"]) / "media-canonical.json").read_text(encoding="utf-8"))
          rows = [o for o in ledger["objects"] if o["object_key"].startswith("legacy/")]
          assert len(rows) == 4995
          assert sum(int(o["bytes"]) for o in rows) == 674646234
          assert all(re.fullmatch(r"legacy/legacy-\d{6}\.[A-Za-z0-9]+", o["object_key"]) for o in rows)
          mapped = [re.sub(r"^legacy/legacy-", "content/asset-", o["object_key"]) for o in rows]
          assert len(set(mapped)) == 4995
          print("fixed-ledger=PASS")
          PY

      - name: Install R2 client
        run: python3 -m pip install --disable-pip-version-check --quiet boto3

      - name: Copy and verify every object
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          import boto3
          from botocore.config import Config

          bucket = os.environ["R2_BUCKET"]
          endpoint = os.environ["R2_ENDPOINT"]
          ledger = json.loads((Path(os.environ["RUNNER_TEMP"]) / "media-canonical.json").read_text(encoding="utf-8"))

          rows = []
          for o in ledger["objects"]:
              old = o["object_key"]
              if not old.startswith("legacy/"):
                  continue
              m = re.fullmatch(r"legacy/legacy-(\d{6})\.([A-Za-z0-9]+)", old)
              assert m, old
              rows.append({
                  "old": old,
                  "new": f"content/asset-{m.group(1)}.{m.group(2)}",
                  "sha256": o["sha256"],
                  "bytes": int(o["bytes"]),
              })

          rows.sort(key=lambda x: x["old"])
          assert len(rows) == 4995
          assert len({x["new"] for x in rows}) == 4995
          assert sum(x["bytes"] for x in rows) == 674646234

          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name="auto",
              config=Config(
                  retries={"max_attempts": 8, "mode": "adaptive"},
                  max_pool_connections=48,
                  connect_timeout=10,
                  read_timeout=120,
              ),
          )

          def list_prefix(prefix):
              result = {}
              paginator = s3.get_paginator("list_objects_v2")
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  for obj in page.get("Contents", []):
                      result[obj["Key"]] = int(obj["Size"])
              return result

          expected_old = {x["old"]: x["bytes"] for x in rows}
          expected_new = {x["new"]: x["bytes"] for x in rows}

          old_listing = list_prefix("legacy/")
          assert old_listing == expected_old, {
              "old_count": len(old_listing),
              "missing": sorted(set(expected_old) - set(old_listing))[:10],
              "extra": sorted(set(old_listing) - set(expected_old))[:10],
          }

          new_before = list_prefix("content/asset-")
          assert not (set(new_before) - set(expected_new)), "unexpected content/asset-* key exists"

          metadata_fields = (
              "ContentType",
              "CacheControl",
              "ContentDisposition",
              "ContentEncoding",
              "ContentLanguage",
              "Metadata",
          )

          def metadata(head):
              return {k: head.get(k) for k in metadata_fields if head.get(k) is not None}

          def digest_object(key):
              body = s3.get_object(Bucket=bucket, Key=key)["Body"]
              h = hashlib.sha256()
              size = 0
              try:
                  for chunk in iter(lambda: body.read(1024 * 1024), b""):
                      h.update(chunk)
                      size += len(chunk)
              finally:
                  body.close()
              return h.hexdigest(), size

          def process(row):
              old_head = s3.head_object(Bucket=bucket, Key=row["old"])
              assert int(old_head["ContentLength"]) == row["bytes"], row["old"]

              old_hash, old_size = digest_object(row["old"])
              assert old_size == row["bytes"], row["old"]
              assert old_hash == row["sha256"], row["old"]

              created = False
              try:
                  new_head = s3.head_object(Bucket=bucket, Key=row["new"])
              except s3.exceptions.ClientError as exc:
                  code = exc.response.get("Error", {}).get("Code")
                  if code not in {"404", "NoSuchKey", "NotFound"}:
                      raise
                  s3.copy_object(
                      Bucket=bucket,
                      Key=row["new"],
                      CopySource={"Bucket": bucket, "Key": row["old"]},
                      MetadataDirective="COPY",
                  )
                  created = True
                  new_head = s3.head_object(Bucket=bucket, Key=row["new"])

              assert int(new_head["ContentLength"]) == row["bytes"], row["new"]
              assert metadata(old_head) == metadata(new_head), row["new"]

              new_hash, new_size = digest_object(row["new"])
              assert new_size == row["bytes"], row["new"]
              assert new_hash == row["sha256"], row["new"]
              assert new_hash == old_hash, row["new"]

              return created

          created = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for was_created in pool.map(process, rows):
                  created += int(was_created)

          new_after = list_prefix("content/asset-")
          assert new_after == expected_new
          old_after = list_prefix("legacy/")
          assert old_after == expected_old

          result = {
              "status": "PASS",
              "bucket": bucket,
              "mapping_count": 4995,
              "source_verified": 4995,
              "destination_created": created,
              "destination_preexisting_verified": 4995 - created,
              "destination_verified": 4995,
              "source_retained": 4995,
              "source_total_bytes": 674646234,
              "destination_total_bytes": 674646234,
              "sha256_mismatch": 0,
              "size_mismatch": 0,
              "metadata_mismatch": 0,
              "missing": 0,
              "extra": 0,
              "collision": 0,
              "first_mapping": [rows[0]["old"], rows[0]["new"]],
              "last_mapping": [rows[-1]["old"], rows[-1]["new"]],
          }

          out = Path(os.environ["RUNNER_TEMP"]) / "step51-result.json"
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload STEP51 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step51-hatchman-r2-neutral-copy-${{ github.run_id }}
          path: ${{ runner.temp }}/step51-result.json
          if-no-files-found: error
          retention-days: 30
