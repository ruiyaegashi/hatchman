name: STEP54 Hatchman Recovery Anchor Validation

on:
  push:
    branches:
      - bod-step54-recovery-verify
    paths:
      - ".github/workflows/step54-recovery-verify.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.HATCHMAN_R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HATCHMAN_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HATCHMAN_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET: hatchman-media
      ANCHOR_SHA: 21907a8840747c985d46fd40661ec3a25ecd1e74
      FIXED_LEDGER_REF: f06de04bafb5a4173c08d87238c7a685bfd1217a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANCHOR_SHA }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Validate anchor repository independence
        shell: bash
        run: |
          set -euo pipefail
          git show "$FIXED_LEDGER_REF:src/media/generated/objects.json" > "$RUNNER_TEMP/objects.json"

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(".")
          articles = sorted((root / "src/content/articles").glob("*.md"))
          assert len(articles) == 407

          old_media = re.compile(rb"/media/legacy/")
          new_media = re.compile(rb"/media/content/asset-(\d{6})\.([A-Za-z0-9]+)")
          technical_article_patterns = [
              b"legacy_path",
              b"legacy-disabled",
              b"legacy-shortcode",
              b"/media/legacy/",
              b"legacy/legacy-",
          ]

          published = 0
          old_refs = 0
          new_refs = 0
          unique_targets = set()
          technical_hits = []

          for path in articles:
              data = path.read_bytes()
              head = data.split(b"---", 2)[1].decode("utf-8")
              status = re.search(r"(?m)^status:\s*([^\r\n]+)", head)
              assert status, path
              normalized = status.group(1).strip().strip('"').strip("'")
              published += int(normalized == "publish")

              old_refs += len(old_media.findall(data))
              matches = list(new_media.finditer(data))
              new_refs += len(matches)
              unique_targets.update(m.group(0).decode("ascii") for m in matches)

              for pattern in technical_article_patterns:
                  if pattern in data:
                      technical_hits.append((path.as_posix(), pattern.decode("ascii")))

          assert published == 404, published
          assert old_refs == 0, old_refs
          assert new_refs == 3422, new_refs
          assert len(unique_targets) == 3348, len(unique_targets)
          assert technical_hits == [], technical_hits[:10]

          technical_patterns = [
              b"/media/legacy/",
              b"src/content/legacy",
              b"legacy_path",
              b"[...legacy]",
              b"legacy-disabled",
              b"legacy-shortcode",
              b"legacy/legacy-",
              b"hatchman-archive",
          ]
          non_article_hits = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith(".git/") or rel.startswith("node_modules/") or rel.startswith("src/content/articles/"):
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              for pattern in technical_patterns:
                  if pattern in data:
                      non_article_hits.append((rel, pattern.decode("ascii")))

          assert non_article_hits == [], non_article_hits[:20]

          handler = Path("src/media/handler.ts").read_text(encoding="utf-8")
          assert "legacy" not in handler.lower()
          assert "/media/" in handler
          assert ".get(" in handler and ".head(" in handler
          assert ".put(" not in handler and ".delete(" not in handler

          routes = Path("public/_routes.json").read_text(encoding="utf-8")
          assert "/media/*" in routes
          wrangler = Path("wrangler.toml").read_text(encoding="utf-8")
          assert 'binding = "MEDIA"' in wrangler
          assert 'bucket_name = "hatchman-media"' in wrangler

          ledger = json.loads(Path(os.environ["RUNNER_TEMP"] + "/objects.json").read_text(encoding="utf-8"))
          expected_content = {
              "/" + key.replace("legacy/legacy-", "media/content/asset-")
              for key in ledger
              if key.startswith("legacy/legacy-")
          }
          assert len(expected_content) == 4995
          assert unique_targets <= expected_content

          summary = {
              "anchor_sha": os.environ["ANCHOR_SHA"],
              "articles": 407,
              "published": 404,
              "old_media_refs": 0,
              "new_media_refs": 3422,
              "unique_media_targets": 3348,
              "technical_article_dependency_hits": 0,
              "technical_non_article_dependency_hits": 0,
              "runtime_legacy_logic_hits": 0,
          }
          Path(os.environ["RUNNER_TEMP"] + "/repo-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Validate neutral R2 recovery set
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${R2_ACCOUNT_ID:-}" ]]
          [[ -n "${AWS_ACCESS_KEY_ID:-}" ]]
          [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]]
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          python3 -m pip install --disable-pip-version-check --quiet boto3
          R2_ENDPOINT="$endpoint" python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import boto3
          from botocore.config import Config

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              region_name="auto",
              config=Config(retries={"max_attempts": 8, "mode": "adaptive"}),
          )
          bucket = os.environ["R2_BUCKET"]

          def listing(prefix):
              result = {}
              paginator = s3.get_paginator("list_objects_v2")
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  for obj in page.get("Contents", []):
                      result[obj["Key"]] = int(obj["Size"])
              return result

          content = listing("content/asset-")
          old = listing("legacy/")
          site = listing("site/")

          assert len(content) == 4995, len(content)
          assert sum(content.values()) == 674646234, sum(content.values())
          assert len(old) == 4995, len(old)
          assert len(site) == 6, len(site)

          repo_summary = json.loads(Path(os.environ["RUNNER_TEMP"] + "/repo-summary.json").read_text())
          result = {
              **repo_summary,
              "r2_content_objects": len(content),
              "r2_content_bytes": sum(content.values()),
              "r2_site_objects": len(site),
              "r2_old_objects_still_present": len(old),
              "old_r2_dependency_required": False,
              "result": "PASS",
          }
          Path(os.environ["RUNNER_TEMP"] + "/step54-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run functions:build

      - name: Upload STEP54 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step54-hatchman-recovery-anchor-${{ github.run_id }}
          path: ${{ runner.temp }}/step54-result.json
          if-no-files-found: error
          retention-days: 30
