name: STEP49 Hatchman repository cleanup

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bod-step49-repository-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Apply STEP49 cleanup
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          assert package['name'] == 'hatchman-archive'
          package['name'] = 'hatchman'
          dev = package.get('devDependencies', {})
          assert 'esbuild' in dev and 'miniflare' in dev
          dev.pop('esbuild')
          dev.pop('miniflare')
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.gitignore').write_text('''node_modules/
          dist/
          .astro/
          .env
          .env.*
          !.env.example
          *.log
          .dev.vars
          .wrangler/
          ''', encoding='utf-8')

          Path('README.md').write_text('''# Hatchman

          Hatchman is a small Astro site for articles and their media.

          ## Production requirements

          1. Existing articles remain available, including their images and files.
          2. Article Markdown lives in GitHub. Images and other binary files live in Cloudflare R2.
          3. New articles can be added as Markdown.

          ## Structure

          - `src/content/articles/`: article Markdown.
          - `src/pages/index.astro`: article list.
          - `src/pages/[...path].astro`: article pages generated from frontmatter `path`.
          - `functions/_middleware.ts` + `src/media/handler.ts`: minimal `/media/*` delivery from R2.
          - `wrangler.toml`: Cloudflare Pages / R2 binding.

          ## Add an article

          Create a Markdown file under `src/content/articles/` with:

          ```yaml
          ---
          title: "Article title"
          published_at: "2026-10-05 12:00:00"
          path: "/article-path/"
          status: publish
          ---
          ```

          Then write the article body below the front matter.

          Draft articles may omit `path` until they are ready to publish.

          ## Media

          Upload images and other binary files to the private R2 bucket and reference them through `/media/<object-key>`.
          The runtime maps that URL directly to the same R2 object key.

          ## Local check

          ```console
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm run functions:build
          ```

          The site intentionally keeps the runtime and content model minimal.
          ''', encoding='utf-8')
          PY

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Validate dependency boundary
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('package.json').read_text())
          assert p['name'] == 'hatchman'
          assert 'esbuild' not in p.get('devDependencies', {})
          assert 'miniflare' not in p.get('devDependencies', {})
          ws = Path('pnpm-workspace.yaml').read_text()
          assert 'esbuild: true' in ws
          assert 'workerd: true' in ws
          readme = Path('README.md').read_text()
          assert 'src/content/legacy/' not in readme
          assert '[...legacy].astro' not in readme
          ignore = Path('.gitignore').read_text()
          for residue in ('affiliate/', '.recovery/', '__pycache__/', '/backups/', '/sources/', '*.sql', '*.zip', '/public/media/', 'STEP 24'):
              assert residue not in ignore, residue
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run functions:build
      - run: git diff --check

      - name: Commit STEP49 cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/step49-cleanup.yml
          git add package.json pnpm-lock.yaml README.md .gitignore
          git diff --cached --quiet && { echo 'No STEP49 changes produced'; exit 1; }
          git commit -m 'Complete STEP49 Hatchman repository cleanup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
