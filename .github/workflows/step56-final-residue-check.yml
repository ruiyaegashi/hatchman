name: STEP56 Hatchman Final Technical Residue Check

on:
  push:
    branches:
      - bod-step56-final-residue-check
    paths:
      - ".github/workflows/step56-final-residue-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANCHOR_SHA: 21907a8840747c985d46fd40661ec3a25ecd1e74
      FIXED_REF: f06de04bafb5a4173c08d87238c7a685bfd1217a
      PRODUCTION_BASE: https://hatchman.org
      R2_ACCOUNT_ID: ${{ secrets.HATCHMAN_R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HATCHMAN_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HATCHMAN_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET: hatchman-media

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANCHOR_SHA }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Fetch fixed historical registry for expected neutral keyset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FIXED_REF" --depth=1
          git show "$FIXED_REF:src/media/generated/objects.json" > "$RUNNER_TEMP/objects.json"

      - name: Validate repository technical residue
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          path_legacy_hits = [p for p in tracked if "legacy" in p.lower()]
          assert path_legacy_hits == [], path_legacy_hits

          article_paths = sorted(Path("src/content/articles").glob("*.md"))
          assert len(article_paths) == 407
          assert not Path("src/content/legacy").exists()
          assert not Path("src/pages/[...legacy].astro").exists()
          assert Path("src/pages/[...path].astro").exists()

          technical_patterns = [
              b"/media/legacy/",
              b"legacy/legacy-",
              b"legacy_path",
              b"legacy-disabled",
              b"legacy-shortcode",
              b"src/content/legacy",
              b"[...legacy]",
              b"hatchman-archive",
          ]

          article_hits = []
          published = 0
          drafts = 0
          old_refs = 0
          new_refs = 0
          unique_new = set()
          published_paths = []

          new_pattern = re.compile(rb"/media/content/asset-(\d{6})\.([A-Za-z0-9]+)")

          for path in article_paths:
              data = path.read_bytes()
              assert not re.match(r"^wp-\d+-", path.name), path.name

              parts = data.split(b"---", 2)
              assert len(parts) == 3, path
              front = parts[1].decode("utf-8")
              keys = []
              for line in front.splitlines():
                  m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*):", line)
                  if m:
                      keys.append(m.group(1))

              allowed = {"title", "published_at", "status", "path"}
              assert set(keys) <= allowed, (path, keys)
              assert {"title", "published_at", "status"} <= set(keys), (path, keys)

              status_m = re.search(r"(?m)^status:\s*([^\r\n]+)", front)
              route_m = re.search(r"(?m)^path:\s*(.+)$", front)
              assert status_m, path
              status = status_m.group(1).strip().strip('"').strip("'")

              if status == "publish":
                  published += 1
                  assert route_m, path
                  route = route_m.group(1).strip().strip('"').strip("'")
                  published_paths.append(route)
              elif status == "draft":
                  drafts += 1
              else:
                  raise AssertionError((path, status))

              for pattern in technical_patterns:
                  if pattern in data:
                      article_hits.append((path.as_posix(), pattern.decode("ascii")))

              old_refs += data.count(b"/media/legacy/")
              matches = list(new_pattern.finditer(data))
              new_refs += len(matches)
              unique_new.update(m.group(0).decode("ascii") for m in matches)

          assert article_hits == [], article_hits[:20]
          assert published == 404, published
          assert drafts == 3, drafts
          assert len(published_paths) == 404
          assert len(set(published_paths)) == 404
          assert not [p for p in published_paths if "legacy" in p.lower()]
          assert old_refs == 0, old_refs
          assert new_refs == 3422, new_refs
          assert len(unique_new) == 3348, len(unique_new)

          non_article_hits = []
          generic_non_article_legacy = []
          for rel in tracked:
              if rel.startswith("src/content/articles/"):
                  continue
              path = Path(rel)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              for pattern in technical_patterns:
                  if pattern in data:
                      non_article_hits.append((rel, pattern.decode("ascii")))
              if b"legacy" in data.lower():
                  generic_non_article_legacy.append(rel)

          assert non_article_hits == [], non_article_hits[:20]
          assert generic_non_article_legacy == [], generic_non_article_legacy

          handler = Path("src/media/handler.ts").read_text(encoding="utf-8")
          assert "legacy" not in handler.lower()
          assert ".get(" in handler and ".head(" in handler
          assert ".put(" not in handler and ".delete(" not in handler

          cfg = Path("src/content.config.ts").read_text(encoding="utf-8")
          assert "./src/content/articles" in cfg
          assert "legacy" not in cfg.lower()

          route = Path("src/pages/[...path].astro").read_text(encoding="utf-8")
          assert "legacy" not in route.lower()

          result = {
              "anchor_sha": os.environ["ANCHOR_SHA"],
              "tracked_path_legacy_hits": 0,
              "articles": 407,
              "published": 404,
              "drafts": 3,
              "published_url_legacy_hits": 0,
              "article_technical_legacy_hits": 0,
              "non_article_technical_legacy_hits": 0,
              "non_article_generic_legacy_hits": 0,
              "old_media_refs": 0,
              "new_media_refs": 3422,
              "unique_current_media_targets": 3348,
              "runtime_legacy_logic_hits": 0,
          }
          Path(os.environ["RUNNER_TEMP"] + "/repo-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run functions:build

      - name: Validate generated output technical residue
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          assert dist.exists()

          technical = [
              b"/media/legacy/",
              b"legacy/legacy-",
              b"legacy_path",
              b"legacy-disabled",
              b"legacy-shortcode",
              b"src/content/legacy",
              b"[...legacy]",
              b"hatchman-archive",
          ]

          path_hits = []
          content_hits = []
          for path in dist.rglob("*"):
              rel = path.relative_to(dist).as_posix()
              if "legacy" in rel.lower():
                  path_hits.append(rel)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              for pattern in technical:
                  if pattern in data:
                      content_hits.append((rel, pattern.decode("ascii")))

          assert path_hits == [], path_hits[:20]
          assert content_hits == [], content_hits[:20]

          result = {
              "generated_output_path_legacy_hits": 0,
              "generated_output_technical_legacy_hits": 0,
          }
          Path(os.environ["RUNNER_TEMP"] + "/generated-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Install R2 client
        run: python3 -m pip install --disable-pip-version-check --quiet boto3

      - name: Validate exact R2 keyset has no legacy residue
        shell: bash
        run: |
          set -euo pipefail
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          import boto3
          from botocore.config import Config

          registry = json.loads((Path(os.environ["RUNNER_TEMP"]) / "objects.json").read_text(encoding="utf-8"))

          expected = {}
          for key, meta in registry.items():
              if key.startswith("legacy/legacy-"):
                  key = key.replace("legacy/legacy-", "content/asset-", 1)
              expected[key] = int(meta["size"])

          assert len(expected) == 5001
          assert len([k for k in expected if k.startswith("content/asset-")]) == 4995
          assert len([k for k in expected if k.startswith("site/")]) == 6
          assert not [k for k in expected if "legacy" in k.lower()]

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              region_name="auto",
              config=Config(retries={"max_attempts": 8, "mode": "adaptive"}),
          )

          actual = {}
          paginator = s3.get_paginator("list_objects_v2")
          for page in paginator.paginate(Bucket=os.environ["R2_BUCKET"]):
              for obj in page.get("Contents", []):
                  actual[obj["Key"]] = int(obj["Size"])

          assert actual == expected, {
              "actual_count": len(actual),
              "expected_count": len(expected),
              "missing": sorted(set(expected) - set(actual))[:20],
              "extra": sorted(set(actual) - set(expected))[:20],
              "size_mismatch": [k for k in expected if k in actual and expected[k] != actual[k]][:20],
          }

          legacy_keys = [k for k in actual if "legacy" in k.lower()]
          assert legacy_keys == [], legacy_keys[:20]

          result = {
              "r2_total_objects": len(actual),
              "r2_content_objects": len([k for k in actual if k.startswith("content/asset-")]),
              "r2_content_bytes": sum(v for k, v in actual.items() if k.startswith("content/asset-")),
              "r2_site_objects": len([k for k in actual if k.startswith("site/")]),
              "r2_legacy_key_hits": 0,
              "r2_unexpected_keys": 0,
              "r2_missing_keys": 0,
              "r2_size_mismatch": 0,
          }
          Path(os.environ["RUNNER_TEMP"] + "/r2-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Validate Production public URLs and rendered output
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = os.environ["PRODUCTION_BASE"].rstrip("/")
          registry = json.loads((Path(os.environ["RUNNER_TEMP"]) / "objects.json").read_text(encoding="utf-8"))

          articles = sorted(Path("src/content/articles").glob("*.md"))
          published_paths = []
          for path in articles:
              data = path.read_bytes()
              front = data.split(b"---", 2)[1].decode("utf-8")
              status_m = re.search(r"(?m)^status:\s*([^\r\n]+)", front)
              route_m = re.search(r"(?m)^path:\s*(.+)$", front)
              assert status_m
              status = status_m.group(1).strip().strip('"').strip("'")
              if status == "publish":
                  assert route_m
                  published_paths.append(route_m.group(1).strip().strip('"').strip("'"))

          assert len(published_paths) == 404
          assert not [p for p in published_paths if "legacy" in p.lower()]

          technical = [
              b"/media/legacy/",
              b"legacy/legacy-",
              b"legacy_path",
              b"legacy-disabled",
              b"legacy-shortcode",
          ]
          current_pattern = re.compile(rb"/media/content/asset-(\d{6})\.([A-Za-z0-9]+)")

          def get_page(route):
              url = base + "/" + route.strip("/") + "/"
              req = urllib.request.Request(url, headers={"User-Agent":"YDI-STEP56-Validator"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return route, response.status, response.read()

          rendered_hits = []
          current_refs = 0
          current_urls = set()

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for route, status, body in pool.map(get_page, published_paths):
                  assert status == 200, (route, status)
                  for pattern in technical:
                      if pattern in body:
                          rendered_hits.append((route, pattern.decode("ascii")))
                  matches = list(current_pattern.finditer(body))
                  current_refs += len(matches)
                  current_urls.update(m.group(0).decode("ascii") for m in matches)

          assert rendered_hits == [], rendered_hits[:20]
          assert current_refs == 3422, current_refs
          assert len(current_urls) == 3348, len(current_urls)

          expected_current = {}
          old_urls = []
          for key, meta in registry.items():
              if key.startswith("legacy/legacy-"):
                  new_key = key.replace("legacy/legacy-", "content/asset-", 1)
                  expected_current["/media/" + new_key] = {
                      "size": int(meta["size"]),
                      "contentType": meta.get("contentType"),
                  }
                  old_urls.append("/media/" + key)

          assert len(expected_current) == 4995
          assert current_urls <= set(expected_current)
          assert len(old_urls) == 4995

          def head_current(path):
              req = urllib.request.Request(
                  base + path,
                  method="HEAD",
                  headers={"User-Agent":"YDI-STEP56-Validator"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  exp = expected_current[path]
                  assert response.status == 200, (path, response.status)
                  assert int(response.headers.get("Content-Length", "-1")) == exp["size"], path
                  if exp["contentType"]:
                      assert response.headers.get("Content-Type") == exp["contentType"], path
                  return path

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              list(pool.map(head_current, sorted(current_urls)))

          # R2 exact keyset + generic same-key handler proves all removed old URLs are absent.
          # Check three boundary representatives on the public endpoint as a runtime sanity check.
          representative_old = [old_urls[0], old_urls[len(old_urls)//2], old_urls[-1]]
          for path in representative_old:
              req = urllib.request.Request(
                  base + path,
                  method="HEAD",
                  headers={"User-Agent":"YDI-STEP56-Validator"},
              )
              try:
                  urllib.request.urlopen(req, timeout=30)
                  raise AssertionError(f"old media URL unexpectedly exists: {path}")
              except urllib.error.HTTPError as exc:
                  assert exc.code == 404, (path, exc.code)

          with urllib.request.urlopen(
              urllib.request.Request(base + "/", headers={"User-Agent":"YDI-STEP56-Validator"}),
              timeout=30,
          ) as response:
              assert response.status == 200

          try:
              urllib.request.urlopen(
                  urllib.request.Request(base + "/__step56-not-found-check__/", headers={"User-Agent":"YDI-STEP56-Validator"}),
                  timeout=30,
              )
              raise AssertionError("unknown route unexpectedly returned success")
          except urllib.error.HTTPError as exc:
              assert exc.code == 404, exc.code

          result = {
              "production_pages_verified": 404,
              "production_page_failures": 0,
              "public_url_legacy_route_hits": 0,
              "rendered_technical_legacy_hits": 0,
              "rendered_current_media_refs": 3422,
              "production_current_media_verified": 3348,
              "production_current_media_failures": 0,
              "old_public_media_boundary_checks": 3,
              "old_public_media_boundary_404": 3,
              "top_status": 200,
              "unknown_route_status": 404,
          }
          Path(os.environ["RUNNER_TEMP"] + "/public-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Consolidate STEP56 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          result = {
              "status": "PASS",
              "repository": json.loads((temp / "repo-result.json").read_text()),
              "generated_output": json.loads((temp / "generated-result.json").read_text()),
              "r2": json.loads((temp / "r2-result.json").read_text()),
              "public": json.loads((temp / "public-result.json").read_text()),
              "technical_legacy_residue": 0,
          }
          (temp / "step56-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload STEP56 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step56-hatchman-final-residue-check-${{ github.run_id }}
          path: ${{ runner.temp }}/step56-result.json
          if-no-files-found: error
          retention-days: 30
