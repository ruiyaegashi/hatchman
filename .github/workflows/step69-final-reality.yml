name: STEP69 Hatchman final reality

on:
  push:
    branches:
      - bod-step56-final-residue-check
    paths:
      - ".github/workflows/step69-final-reality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21907a8840747c985d46fd40661ec3a25ecd1e74
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build current main
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm run functions:build
      - name: Validate Production and R2
        run: |
          python - <<'PY'
          import concurrent.futures, json, pathlib, re, time, urllib.error, urllib.request
          PROD="https://hatchman.org"
          SNAP="https://bod-step56-final-residue-che.hatchman.pages.dev/__ydi_step69_r2"
          UA="YDI-STEP69-Hatchman/1.0"

          def req(url, method="GET"):
              r=urllib.request.Request(url,method=method,headers={"User-Agent":UA})
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      return x.status,dict(x.headers),x.read() if method!="HEAD" else b""
              except urllib.error.HTTPError as e:
                  return e.code,dict(e.headers),e.read() if method!="HEAD" else b""

          articles=[]
          for p in pathlib.Path("src/content/articles").glob("*.md"):
              t=p.read_text(encoding="utf-8")
              fm=t.split("---",2)[1]
              s=re.search(r'^status:\s*["\']?([^"\'\s]+)',fm,re.M)
              path=re.search(r'^path:\s*["\']([^"\']+)["\']',fm,re.M)
              if s and s.group(1)=="publish":
                  articles.append(path.group(1))
          assert len(articles)==404, len(articles)

          media=set()
          rx=re.compile(r'/media/([^"\'<>\s)]+)')
          for p in pathlib.Path("src").rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".md",".astro",".css",".ts",".js"}:
                  continue
              try: t=p.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              media.update(rx.findall(t))
          assert len(media)==3348, len(media)

          abad=[]
          def ca(p):
              code,_,_=req(PROD+p)
              return None if code==200 else (p,code)
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              for x in ex.map(ca,articles):
                  if x: abad.append(x)

          mbad=[]
          def cm(k):
              code,_,_=req(PROD+"/media/"+k,"HEAD")
              return None if code==200 else (k,code)
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for x in ex.map(cm,sorted(media)):
                  if x: mbad.append(x)

          home_code,_,home=req(PROD+"/")
          home_text=home.decode("utf-8","replace")
          assert "G-E571E34BQF" in home_text
          assert "ca-pub-7781274978364717" in home_text
          assert "/media/site/logo_title.png" in home_text
          ads_code,_,ads=req(PROD+"/ads.txt")
          unknown=req(PROD+"/__ydi_step69_not_found__")[0]

          snap=None
          for _ in range(120):
              code,_,body=req(SNAP)
              if code==200:
                  snap=json.loads(body.decode())
                  break
              time.sleep(2)
          assert snap is not None
          keys=[o["key"] for o in snap["objects"]]
          content_keys=[k for k in keys if k.startswith("content/asset-")]
          site_keys=[k for k in keys if k.startswith("site/")]
          assert snap["count"]==5001, snap["count"]
          assert snap["total_bytes"]==675034469, snap["total_bytes"]
          assert len(content_keys)==4995, len(content_keys)
          assert len(site_keys)==6, len(site_keys)
          assert len(content_keys)+len(site_keys)==len(keys)
          assert "content/ydi-step68-normal-operation.png" not in keys

          assert not abad,abad[:10]
          assert not mbad,mbad[:10]
          assert home_code==200
          assert ads_code==200 and len(ads)>0
          assert unknown==404

          print(json.dumps({
            "main":"21907a8840747c985d46fd40661ec3a25ecd1e74",
            "build":"PASS",
            "production_articles":404,
            "article_failures":0,
            "production_media":3348,
            "media_failures":0,
            "home":200,
            "ads_txt":200,
            "analytics":"PASS",
            "adsense":"PASS",
            "top_logo":"PASS",
            "unknown":404,
            "r2_objects":snap["count"],
            "r2_total_bytes":snap["total_bytes"],
            "content_objects":len(content_keys),
            "site_objects":len(site_keys),
            "step68_test_residue":0
          },ensure_ascii=False,indent=2))
          PY
